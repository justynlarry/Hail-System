<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Hail System{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
    {% if session.emp_id %}
    <p class="userbar">
        Signed in as {{ session.user_name }}
        <form method="post" action="{{ url_for('main.logout') }}">
            <button type="submit">Sign Out</button>
        </form>
    </p>
    <nav class="nav">
        <a href="{{ url_for('main.index') }}">Storm Days</a>
        <a href="{{ url_for('main.territory') }}">Territory</a>
    </nav>
    {% endif %}
      <h1>{% block heading %}Hail {% endblock %}</h1>
    {% block content %}{% endblock %}
    </body>
</html>
